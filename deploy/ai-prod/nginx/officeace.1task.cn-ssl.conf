# officeace2api HTTPS 入口
# 证书：acme.sh（Let's Encrypt），HTTP-01，自动续期并 reload nginx。
#
# ⚠️ 本文件被 nginx 在 http 块内 include ⇒ limit_req_zone 可以写在 server 之外。
limit_req_zone $binary_remote_addr zone=officeace_api:10m rate=600r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name officeace.1task.cn;

    ssl_certificate     /www/server/panel/vhost/cert/officeace.1task.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/officeace.1task.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /www/wwwlogs/officeace.1task.cn.log;
    error_log  /www/wwwlogs/officeace.1task.cn.error.log;

    auth_basic off;   # 入口不做 basic auth，鉴权在应用层（Bearer / X-Panel-Key）

    location / {
        # 温和洪水闸门：面板无 key 会 401，挡一下暴力猜 key；正常调用远低于阈值
        limit_req zone=officeace_api burst=200 nodelay;
        limit_req_status 429;
        include /www/server/panel/vhost/nginx/officeace-proxy.inc;
    }
}
